name: CI

on:
  push:
  pull_request:

jobs:
  build-flink:
    name: Build Flink job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven build
        working-directory: flink-job
        run: mvn -B -ntp clean package

  python-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r dashboard/requirements.txt -r data-simulator/requirements.txt
      - name: Compile check
        run: python -m compileall -q dashboard data-simulator
